    <title>AST Code Plagiarism Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#1e293b',
                900: '#0f172a',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for code blocks */
      .code-scroll::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .code-scroll::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      .code-scroll::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      .code-scroll::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
    </style>
